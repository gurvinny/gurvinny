  </rect>

  <text x="181" y="146" font-family="'Courier New', monospace" font-size="11" fill="#00ffe7" opacity="0.55" letter-spacing="1.5">CYBERSECURITY</text>
  <text x="323" y="146" font-family="'Courier New', monospace" font-size="11" fill="#ffffff" opacity="0.2" letter-spacing="1">·</text>
  <text x="336" y="146" font-family="'Courier New', monospace" font-size="11" fill="#00ffe7" opacity="0.55" letter-spacing="1.5">ETHICAL HACKER</text>
  <text x="484" y="146" font-family="'Courier New', monospace" font-size="11" fill="#ffffff" opacity="0.2" letter-spacing="1">·</text>
  <text x="497" y="146" font-family="'Courier New', monospace" font-size="11" fill="#ff003c" opacity="0.8" letter-spacing="1.5">RED TEAM
