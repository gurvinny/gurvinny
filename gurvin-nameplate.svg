<svg width="860" height="200" viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gs-bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#010710;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#010c14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#010710;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gs-sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffe7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffe7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00ffe7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="gs-cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffe7;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#00ffe7;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#00ffe7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffe7;stop-opacity:0" />
    </linearGradient>

    <linearGradient id="gs-gridFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0" />
      <stop offset="15%" style="stop-color:white;stop-opacity:1" />
      <stop offset="85%" style="stop-color:white;stop-opacity:1" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    
    <mask id="gs-gridMask">
      <rect width="860" height="200" fill="url(#gs-gridFade)" />
    </mask>

    <filter id="gs-cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <filter id="gs-hexGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <clipPath id="gs-binaryClip">
      <rect x="140" y="155" width="0" height="20">
        <animate attributeName="width" values="0; 600; 600" keyTimes="0; 0.4; 1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    
    <clipPath id="gs-glitchSlice1">
      <rect x="0" y="70" width="860" height="15"/>
    </clipPath>
    <clipPath id="gs-glitchSlice2">
      <rect x="0" y="90" width="860" height="10"/>
    </clipPath>
  </defs>

  <g opacity="0.3">
    <text x="20" y="-300" font-family="'Courier New', monospace" font-size="10" fill="#00ff14" letter-spacing="1.5">
      <animate attributeName="y" from="-300" to="200" dur="4s" repeatCount="indefinite" calcMode="linear"/>
      <tspan x="20" dy="1em">10110</tspan>
      <tspan x="20" dy="1.1em">A9F2</tspan>
      <tspan x="20" dy="1.1em">7</tspan>
      <tspan x="20" dy="1.1em">0111</tspan>
      <tspan x="20" dy="1.1em">CDE</tspan>
    </text>
    <text x="35" y="-400" font-family="'Courier New', monospace" font-size="10" fill="#00ff14" letter-spacing="1.5">
      <animate attributeName="y" from="-400" to="300" dur="5s" repeatCount="indefinite" calcMode="linear"/>
      <tspan x="35" dy="1em">001</tspan>
      <tspan x="35" dy="1.1em">B8</tspan>
      <tspan x="35" dy="1.1em">65</tspan>
      <tspan x="35" dy="1.1em">F02</tspan>
      <tspan x="35" dy="1.1em">1</tspan>
    </text>
    <text x="50" y="-250" font-family="'Courier New', monospace" font-size="10" fill="#00ff14" letter-spacing="1.5">
