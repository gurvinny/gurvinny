      <tspan x="810" dy="1em">D71B</tspan>
      <tspan x="810" dy="1.1em">101</tspan>
      <tspan x="810" dy="1.1em">F</tspan>
      <tspan x="810" dy="1.1em">0011</tspan>
      <tspan x="810" dy="1.1em">5</tspan>
    </text>
    <text x="825" y="-300" font-family="'Courier New', monospace" font-size="10" fill="#00ff14" letter-spacing="1.5">
      <animate attributeName="y" from="-300" to="300" dur="3.5s" repeatCount="indefinite" calcMode="linear"/>
      <tspan x="825" dy="1em">A9F</tspan>
      <tspan x="825" dy="1.1em">01</tspan>
      <tspan x="825" dy="1.1em">CDE</tspan>
      <tspan x="825" dy="1.1em">B8</tspan>
      <tspan x="825" dy="1.1em">7</tspan>
    </text>
    <text x="840" y="-200" font-family="'Courier New', monospace" font-size="10" fill="#00ff14" letter-spacing="1.5">
      <animate attributeName="y" from="-200" to="200" dur="2.8s" repeatCount="indefinite" calcMode="linear"/>
      <tspan x="840" dy="1em">10110</tspan>
      <tspan x="840" dy="1.1em">C</tspan>
      <tspan x="840" dy="1.1em">E3</tspan>
      <tspan x="840" dy="1.1em">DF</tspan>
      <tspan x="840" dy="1.1em">1</tspan>
    </text>
  </g>

  <rect width="860" height="200" fill="url(#gs-bgGrad)" rx="10" />

  <rect x="-200" y="0" width="200" height="200" fill="url(#gs-sweepGrad)" rx="10">
