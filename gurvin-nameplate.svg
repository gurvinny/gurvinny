<svg width="860" height="200" viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020c14;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#030f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#021018;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffe7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ffe7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00ffe7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffe7;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#00ffe7;stop-opacity:1" />
      <stop offset="80%" style="stop-color:#00ffe7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ffe7;stop-opacity:0" />
    </linearGradient>

    <linearGradient id="gridFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0" />
      <stop offset="15%" style="stop-color:white;stop-opacity:1" />
      <stop offset="85%" style="stop-color:white;stop-opacity:1" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0" />
    </linearGradient>
    <mask id="gridMask">
      <rect width="860" height="200" fill="url(#gridFade)" />
    </mask>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="hexGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <clipPath id="binaryClip">
      <rect x="140" y="155" width="0" height="20">
        <animate attributeName="width" values="0; 600; 600" keyTimes="0; 0.4; 1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    
    <clipPath id="glitchSlice1">
      <rect x="0" y="70" width="860" height="15"/>
    </clipPath>
    <clipPath id="glitchSlice2">
      <rect x="0" y="90" width="860" height="10"/>
    </clipPath>
  </defs>

  <rect width="860" height="200" fill="url(#bgGrad)" rx="10" />

  <rect x="-200" y="0" width="200" height="200" fill="url(#sweepGrad)" rx="10">
    <animate attributeName="x" from="-200" to="1000" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g mask="url(#gridMask)" opacity="0.07">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-80,0" dur="4s" repeatCount="indefinite" calcMode="linear"/>
      <line x1="0" y1="0" x2="0" y2="200" stroke="#00ffe7" stroke-width="0.5"/>
      <line x1="80" y1="0" x2="80" y2="200" stroke="#00ffe7" stroke-width="0.5"/>
      <line x1="160" y1="0" x2="160" y2="200" stroke="#00ffe7" stroke-width="0.5"/>
      <line x1="240" y1="0" x2="240" y2="200" stroke="#00ffe7" stroke-width="0.5"/>
      <line x1="320" y1="0" x2="320" y2="200" stroke="#00ffe7" stroke-width="0.5"/>
      <line x1="400" y1="0" x2="400" y2="200" stroke="#00ffe7" stroke-width="0.5"/>
      <line x1="480" y1="0" x2="480" y2="200" stroke="#00ffe7" stroke-width="0.5"/>
      <line x1="560" y1="0" x2="560" y2="200" stroke="#00ffe7" stroke-width="0.5"/>
      <line x1="640" y1="0" x2="640" y2="200" stroke="#00ffe7" stroke-width="0.5"/>
      <line x1="720" y1="0" x2="720" y2="200" stroke="#00ffe7" stroke-width="0.5"/>
      <line x1="800" y1="0" x2="800" y2="200" stroke="#00ffe7" stroke-width="0.5"/>
      <line x1="880" y1="0" x2="880" y2="200" stroke="#00ffe7" stroke-width="0.5"/>
      <line x1="960" y1="0" x2="960" y2="200" stroke="#00ffe7" stroke-width="0.5"/>
    </g>
    <line x1="0" y1="40" x2="860" y2="40" stroke="#00ffe7" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="860" y2="80" stroke="#00ffe7" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="860" y2="120" stroke="#00ffe7" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="860" y2="160" stroke="#00ffe7" stroke-width="0.5"/>
  </g>

  <rect width="858" height="198" x="1" y="1" fill="none" stroke="#00ffe7" stroke-width="0.5" rx="9" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/>
  </rect>

  <polyline points="10,30 10,10 30,10" fill="none" stroke="#00ffe7" stroke-width="2" opacity="0.9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </polyline>
  <polyline points="830,10 850,10 850,30" fill="none" stroke="#00ffe7" stroke-width="2" opacity="0.9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" repeatCount="indefinite"/>
  </polyline>
  <polyline points="10,170 10,190 30,190" fill="none" stroke="#00ffe7" stroke-width="2" opacity="0.9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/>
  </polyline>
  <polyline points="830,190 850,190 850,170" fill="none" stroke="#00ffe7" stroke-width="2" opacity="0.9">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
  </polyline>

  <g transform="translate(68, 100)" filter="url(#hexGlow)">
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="none" stroke="#00ffe7" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-26 22,-13 22,13 0,26 -22,13 -22,-13" fill="none" stroke="#00ffe7" stroke-width="0.8" opacity="0.3"/>
    <rect x="-10" y="-4" width="20" height="16" rx="2" fill="none" stroke="#00ffe7" stroke-width="1.8" opacity="0.9"/>
    <path d="M -6,-4 L -6,-10 C -6,-16 6,-16 6,-10 L 6,-4" fill="none" stroke="#00ffe7" stroke-width="1.8" opacity="0.9"/>
    
    <circle cx="0" cy="5" r="2.5" fill="#ff003c" opacity="0.9"/>
    <line x1="0" y1="7" x2="0" y2="10" stroke="#ff003c" stroke-width="1.8" opacity="0.9"/>
    
    <line x1="-20" y1="-4" x2="20" y2="-4" stroke="#ff003c" stroke-width="0.5" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" from="0,-18" to="0,20" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="2.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <line x1="120" y1="40" x2="120" y2="160" stroke="#00ffe7" stroke-width="0.8" opacity="0.4"/>

  <rect x="140" y="32" width="138" height="18" rx="2" fill="#00ffe7" fill-opacity="0.07" stroke="#00ffe7" stroke-width="0.6" stroke-opacity="0.4"/>
  <text x="151" y="45" font-family="'Courier New', monospace" font-size="10" fill="#00ff41" fill-opacity="0.8" letter-spacing="2">IDENTITY::VERIFIED</text>

  <text x="142" y="108" font-family="'Courier New', Courier, monospace" font-size="52" font-weight="700" letter-spacing="4" fill="#00ff41" opacity="0" clip-path="url(#glitchSlice1)">
    GURVIN SINGH
    <animate attributeName="x" values="142;150;142" dur="0.15s" begin="3s" repeatCount="3"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="0.15s" begin="3s" repeatCount="3"/>
  </text>
  
  <text x="138" y="108" font-family="'Courier New', Courier, monospace" font-size="52" font-weight="700" letter-spacing="4" fill="#ff003c" opacity="0" clip-path="url(#glitchSlice2)">
    GURVIN SINGH
    <animate attributeName="x" values="138;130;138" dur="0.12s" begin="3.05s" repeatCount="3"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="0.12s" begin="3.05s" repeatCount="3"/>
  </text>

  <text x="140" y="108" font-family="'Courier New', Courier, monospace" font-size="52" font-weight="700" letter-spacing="4" fill="#ffffff" filter="url(#cyanGlow)">
    GURVIN SINGH
    <animate attributeName="x" values="140;141;139;140" dur="0.15s" begin="3s" repeatCount="3"/>
  </text>

  <rect x="140" y="116" width="520" height="2" rx="1" fill="url(#cyanBar)" opacity="0.8">
    <animate attributeName="width" values="0;520" dur="1.5s" fill="freeze"/>
  </rect>

  <text x="141" y="146" font-family="'Courier New', monospace" font-size="11" fill="#00ffe7" opacity="0.55" letter-spacing="1.5">CYBERSECURITY</text>
  <text x="283" y="146" font-family="'Courier New', monospace" font-size="11" fill="#ffffff" opacity="0.2" letter-spacing="1">·</text>
  <text x="296" y="146" font-family="'Courier New', monospace" font-size="11" fill="#00ffe7" opacity="0.55" letter-spacing="1.5">ETHICAL HACKER</text>
  <text x="444" y="146" font-family="'Courier New', monospace" font-size="11" fill="#ffffff" opacity="0.2" letter-spacing="1">·</text>
  <text x="457" y="146" font-family="'Courier New', monospace" font-size="11" fill="#ff003c" opacity="0.8" letter-spacing="1.5">RED TEAM
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </text>

  <text x="140" y="168" font-family="'Courier New', monospace" font-size="8" fill="#00ffe7" opacity="0.18" letter-spacing="2" clip-path="url(#binaryClip)">
    01000111 01010101 01010010 01010110 01001001 01001110 00100000 01010011 01001001 01001110 01000111 01001000
  </text>

  <g transform="translate(730, 72)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="9" fill="#00ffe7" opacity="0.5" letter-spacing="2">STATUS</text>
    <circle cx="6" cy="16" r="4" fill="#00ff41" opacity="0.9">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="6" cy="16" r="8" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="4;12" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="19" y="20" font-family="'Courier New', monospace" font-size="10" fill="#00ff41" opacity="0.85" letter-spacing="1">ONLINE</text>
  </g>

  <g transform="translate(713, 108)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="9" fill="#00ffe7" opacity="0.5" letter-spacing="2">ACCESS</text>
    <text x="0" y="18" font-family="'Courier New', monospace" font-size="10" fill="#00ff41" opacity="0.85" letter-spacing="1">ROOT LEVEL</text>
  </g>

  <circle cx="810" cy="148" r="1.5" fill="#00ffe7" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="148" r="1.5" fill="#00ffe7" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="148" r="1.5" fill="#00ffe7" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="1s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <text x="762" y="44" font-family="'Courier New', monospace" font-size="9" fill="#ff003c" opacity="0.6" letter-spacing="1">[ SYS_ID: GS ]</text>

</svg>