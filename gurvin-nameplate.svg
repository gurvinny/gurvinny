      <tspan x="50" dy="1em">1</tspan>
      <tspan x="50" dy="1.1em">CE3A</tspan>
      <tspan x="50" dy="1.1em">011</tspan>
      <tspan x="50" dy="1.1em">DF</tspan>
      <tspan x="50" dy="1.1em">4</tspan>
    </text>
    <text x="810" y="-350" font-family="'Courier New', monospace" font-size="10" fill="#00ff14" letter-spacing="1.5">
